name: Master CI/CD

on:
    push:
        branches:
            - master

# El push del release a master lo hace la GitHub App "Chamba Lab CD Bot" (token
# generado abajo), que está en la lista de bypass de la protección de master.
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    release-and-deploy:
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, 'skip ci')"
        concurrency:
            group: "production"
            cancel-in-progress: true

        steps:
            - name: Generate release token
              id: app-token
              uses: actions/create-github-app-token@v3.2.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Configure Git User
              run: |
                  git config --global user.name "Chamba Lab [Bot]"
                  git config --global user.email "melodiaz2111@gmail.com"

            - name: Validate Code
              run: |
                  npm run lint
                  npm run test

            - name: Automated Version Release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  npm run release -- --ci --no-git.requireCleanWorkingDir --git.commitMessage="chore: release v\${version} [skip ci]"

            - name: Build Project
              run: npm run build

            # No GitHub Pages artifact upload since Astro static output needs explicit config or specific folder.
            # Assuming 'dist' matches build output.

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v5
