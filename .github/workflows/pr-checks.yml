name: PR Checks

on:
    pull_request:
        branches:
            - master
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read

concurrency:
    group: pr-checks-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Lint, Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

    # Solo avisa: no es un check obligatorio y nunca falla, porque a veces hay
    # alertas sin parche upstream que no deben frenar un PR.
    audit:
        name: Dependency audit (advisory)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "lts/*"

            # npm audit lee package-lock.json; no hace falta instalar dependencias.
            - name: npm audit (high y critical)
              run: |
                  if npm audit --audit-level=high > audit.txt 2>&1; then
                      echo "✅ npm audit: sin vulnerabilidades altas ni críticas." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "::warning title=npm audit::Hay dependencias con vulnerabilidades altas o críticas. El detalle está en el resumen de este job."
                      {
                          echo "## ⚠️ npm audit"
                          echo
                          echo '```'
                          cat audit.txt
                          echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                  fi

    pr-title:
        name: PR title (Conventional Commits)
        runs-on: ubuntu-latest
        steps:
            # El título del PR se convierte en el mensaje del commit al hacer squash
            # y alimenta el changelog, por eso debe seguir Conventional Commits.
            - name: Validate title
              env:
                  TITLE: ${{ github.event.pull_request.title }}
              run: |
                  pattern='^(feat|fix|docs|perf|refactor|chore|test|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'
                  if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
                      echo "::error::El título del PR debe seguir Conventional Commits, por ejemplo: 'feat: add team logos'."
                      echo "Título actual: $TITLE"
                      exit 1
                  fi
