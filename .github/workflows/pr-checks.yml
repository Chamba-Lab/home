name: PR Checks

# Lint, tests, build y audit corren al abrir el PR o al subir commits. El título
# se valida en pr-title.yml, que además escucha las ediciones: así editar la
# descripción o el título no relanza todo. Sin caché de npm: cada release cambia
# package-lock.json (su campo version) y creaba una caché nueva de ~100 MB por
# release, hasta pasar el límite de 10 GB del repositorio.

on:
    pull_request:
        branches:
            - master
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: pr-checks-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Lint, Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "lts/*"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

    # Solo avisa: no es un check obligatorio y nunca falla, porque a veces hay
    # alertas sin parche upstream que no deben frenar un PR.
    audit:
        name: Dependency audit (advisory)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "lts/*"

            # npm audit lee package-lock.json; no hace falta instalar dependencias.
            - name: npm audit (high y critical)
              run: |
                  if npm audit --audit-level=high > audit.txt 2>&1; then
                      echo "✅ npm audit: sin vulnerabilidades altas ni críticas." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "::warning title=npm audit::Hay dependencias con vulnerabilidades altas o críticas. El detalle está en el resumen de este job."
                      {
                          echo "## ⚠️ npm audit"
                          echo
                          echo '```'
                          cat audit.txt
                          echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                  fi
